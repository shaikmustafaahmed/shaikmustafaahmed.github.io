<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mustafa Ahmed | Personal Portfolio</title>

    <meta name="description"
          content="Personal portfolio of Mustafa Ahmed, BCA Graduate focused on IT Support, Technical Support and IT Operations.">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--light);
            color: var(--text);
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: min(1120px, 92%);
            margin: auto;
        }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .nav-inner {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Hero */
        .hero {
            padding: 95px 0 80px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.35fr 0.65fr;
            gap: 60px;
            align-items: center;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #eff6ff;
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: 700;
        }

        .hero h1 {
            font-size: clamp(40px, 6vw, 68px);
            line-height: 1.05;
            color: var(--dark);
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero h2 {
            font-size: clamp(20px, 3vw, 30px);
            margin-bottom: 18px;
            color: #1e293b;
        }

        .hero p {
            max-width: 680px;
            color: var(--muted);
            font-size: 17px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            transition: 0.25s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 1px solid var(--border);
            background: white;
            color: var(--dark);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .profile-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .profile-avatar {
            width: 170px;
            height: 170px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .profile-card h3 {
            color: var(--dark);
            margin-bottom: 6px;
        }

        .profile-card p {
            font-size: 14px;
            color: var(--muted);
        }

        /* Sections */
        section {
            padding: 85px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 48px;
        }

        .section-title .icon {
            font-size: 30px;
            display: block;
            margin-bottom: 8px;
        }

        .section-title h2 {
            color: var(--dark);
            font-size: 34px;
            margin-bottom: 10px;
        }

        .section-title p {
            max-width: 700px;
            margin: auto;
            color: var(--muted);
        }

        /* About */
        .about-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 34px;
            box-shadow: var(--shadow);
        }

        .about-box p {
            margin-bottom: 14px;
        }

        /* Education */
        .timeline {
            max-width: 850px;
            margin: auto;
            display: grid;
            gap: 20px;
        }

        .timeline-item {
            background: white;
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .timeline-item h3 {
            color: var(--dark);
            margin-bottom: 6px;
        }

        .timeline-item .date {
            display: inline-block;
            margin: 5px 0 10px;
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 14px;
        }

        /* Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .skill-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .skill-head {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
        }

        .skill-head strong {
            color: var(--dark);
        }

        .skill-level {
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
        }

        .bar {
            width: 100%;
            height: 9px;
            border-radius: 999px;
            overflow: hidden;
            background: #e2e8f0;
        }

        .fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
        }

        /* Projects */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .project-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .project-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .project-card h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .project-card p {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }

        .tag {
            padding: 6px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
        }

        .project-link {
            margin-top: auto;
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 14px;
        }

        .project-link:hover {
            text-decoration: underline;
        }

        /* Languages */
        .language-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            max-width: 780px;
            margin: auto;
        }

            border: 1px solid var(--border);
            border-radius: 14px;
