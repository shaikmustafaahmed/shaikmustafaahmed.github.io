<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mustafa Ahmed | IT Support Portfolio
    </title>

    <meta
        name="description"
        content="Mustafa Ahmed - BCA Graduate | IT Support | Technical Support | IT Operations"
    >

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #334155;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: auto;
        }


        /* =========================
           COLORS
        ========================= */

        :root {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --light-blue: #eff6ff;
            --dark: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --light: #f8fafc;
            --card: #f1f5f9;
            --border: #dbe4ef;
            --white: #ffffff;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.97);

            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark);
        }

        .logo span {
            color: var(--blue);
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-wrap: wrap;

            gap: 18px;

            list-style: none;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .nav-links a:hover {
            color: var(--blue);
        }


        /* =========================
           FLOATING EMAIL BUTTON
        ========================= */

        .floating-email {
            position: fixed;

            top: 100px;
            right: 20px;

            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: var(--blue);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);

            z-index: 999;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 88vh;

            display: flex;
            align-items: center;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #f8fafc 100%
                );
        }

        .hero-grid {
            display: grid;

            grid-template-columns:
                1.2fr
                0.8fr;

            gap: 55px;

            align-items: center;
        }

        .hero-tag {
            display: inline-block;

            background: var(--light-blue);
            color: var(--blue-dark);

            padding: 7px 14px;

            border-radius: 50px;

            font-size: 13px;
            font-weight: 800;

            margin-bottom: 18px;
        }

        .hero h1 {
            color: var(--dark);

            font-size:
                clamp(40px, 6vw, 68px);

            line-height: 1.1;

            margin-bottom: 14px;
        }

        .hero h1 span {
            color: var(--blue);
        }

        /*
           ONLY ANIMATION ON THE WEBSITE:
           Name typing animation
        */

        .typing-name {
            color: var(--blue);
            font-weight: 800;

            border-right: 3px solid var(--blue);

            white-space: nowrap;
            overflow: hidden;

            width: 0;

            animation:
                typing 4s steps(23, end) forwards,
                cursorBlink 0.8s infinite;
        }

        @keyframes typing {

            from {
                width: 0;
            }

            to {
                width: 23ch;
            }

        }

        @keyframes cursorBlink {

            50% {
                border-color: transparent;
            }

        }

        .university {
            font-size: 25px;
            font-weight: 800;

            color: var(--text);

            margin-bottom: 12px;
        }

        .hero-description {
            max-width: 700px;

            color: var(--muted);

            font-size: 17px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;

            gap: 12px;

            margin-top: 25px;
        }

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 13px 20px;

            border-radius: 11px;

            font-size: 14px;
            font-weight: 800;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover {
            background: var(--blue-dark);
        }

        .btn-outline {
            background: white;
            color: var(--dark);

            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            color: var(--blue);
        }

        .profile-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 35px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.07);
        }

        .profile-avatar {
            width: 170px;
            height: 170px;

            margin: auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eff6ff
                );

            font-size: 72px;
        }

        .profile-card h3 {
            color: var(--dark);

            font-size: 24px;

            margin-top: 18px;
        }

        .profile-card p {
            color: var(--muted);

            margin-top: 5px;
        }


        /* =========================
           SECTION HEADINGS
        ========================= */

        section {
            padding: 80px 0;
        }

        .section-heading {
            text-align: center;

            margin-bottom: 45px;
        }

        .section-heading .icon {
            display: block;

            font-size: 30px;

            margin-bottom: 5px;
        }

        .section-heading h2 {
            display: inline-block;

            color: var(--blue);

            font-size: 35px;
        }

        .section-heading h2::after {
            content: "";

            display: block;

            width: 55px;
            height: 3px;

            background: var(--blue);

            margin:
                8px auto 0;
        }

        .section-heading p {
            color: var(--muted);

            max-width: 750px;

            margin:
                12px auto 0;
        }


        /* =========================
           ABOUT
        ========================= */

        .about-box {
            max-width: 900px;

            margin: auto;

            padding: 32px;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 20px;
        }

        .about-box p {
            margin-bottom: 14px;
        }

        .about-box p:last-child {
            margin-bottom: 0;
        }


        /* =========================
           EDUCATION
        ========================= */

        .education-card {
            max-width: 900px;

            margin: auto;

            background: white;

            border:
                1px solid var(--border);

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 10px 30px
                rgba(15, 23, 42, 0.05);
        }

        .education-date {
            color: var(--blue);

            font-weight: 800;

            margin-bottom: 5px;
        }

        .education-card h3 {
            color: var(--dark);

            font-size: 22px;

            margin-bottom: 8px;
        }

        .education-card p {
            color: var(--muted);

            margin-bottom: 4px;
        }


        /* =========================
           HOBBIES
        ========================= */

        .hobbies-grid {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 16px;
        }

        .hobby-card {
            background: white;

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 25px 12px;

            text-align: center;
        }

        .hobby-icon {
            font-size: 38px;

            margin-bottom: 9px;
        }

        .hobby-card h3 {
            color: var(--dark);

            font-size: 15px;
        }


        /* =========================
           SKILLS
        ========================= */

        .skills-section {
            background: var(--light);
        }

        .skills-grid {
            max-width: 950px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .skill-card {
            background: white;

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 22px;
        }

        .skill-name {
            color: var(--dark);

            font-weight: 800;

            margin-bottom: 7px;
        }

        .skill-description {
            color: var(--muted);

            font-size: 14px;
        }


        /* =========================
           SKILL LEVELS
        ========================= */

        .skill-levels {
            max-width: 950px;

            margin: 40px auto 0;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .level-card {
            background: white;

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 20px;
        }

        .level-top {
            display: flex;

            justify-content: space-between;

            margin-bottom: 9px;
        }

        .level-name {
            font-weight: 800;

            color: var(--dark);
        }

        .level-number {
            font-weight: 800;

            color: var(--blue);
        }

        .level-bar {
            width: 100%;

            height: 10px;

            border-radius: 50px;

            background: #e2e8f0;
        }

        .level-fill {
            height: 100%;

            border-radius: 50px;

            background: var(--blue);
        }


        /* =========================
           PROJECTS
        ========================= */

        .projects-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 24px;
        }

        .project-card {
            background: white;

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding: 30px;
        }

        .project-icon {
            font-size: 45px;

            margin-bottom: 8px;
        }

        .project-card h3 {
            color: var(--dark);

            font-size: 21px;

            margin-bottom: 9px;
        }

        .project-card p {
            color: var(--muted);

            margin-bottom: 17px;
        }

        .tags {
            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 18px;
        }

        .tag {
            background: #eef2ff;

            color: #475569;

            padding:
                5px 10px;

            border-radius: 50px;

            font-size: 11px;

            font-weight: 800;
        }

        .project-link {
            color: var(--blue-dark);

            font-weight: 800;
        }


        /* =========================
           LEARNING JOURNEY
        ========================= */

        .learning-section {
            background: var(--light);
        }

        .learning-grid {
            max-width: 950px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

            background:
