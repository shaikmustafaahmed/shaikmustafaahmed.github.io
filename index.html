<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mustafa Ahmed | Personal Portfolio</title>

    <meta
        name="description"
        content="Personal portfolio of Mustafa Ahmed, BCA Graduate focused on IT Support, Technical Support and IT Operations."
    >

    <style>
        :root {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --blue-light: #eff6ff;
            --dark: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --light: #f8fafc;
            --card: #f1f5f9;
            --border: #dbe4ef;
            --white: #ffffff;
            --shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        html {
            scroll-padding-top: 90px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--white);
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: min(1120px, 92%);
            margin: auto;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            list-style: none;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            transition: color 0.25s ease;
        }

        .nav-links a:hover {
            color: var(--blue);
        }

        /* Floating Button */

        .floating-button {
            position: fixed;
            right: 20px;
            top: 120px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.3);
            animation: floatButton 3s ease-in-out infinite;
        }

        @keyframes floatButton {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 88vh;
            display: flex;
            align-items: center;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            overflow: hidden;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 55px;
            align-items: center;
        }

        .hero-badge {
            display: inline-block;
            background: var(--blue-light);
            color: var(--blue-dark);
            padding: 8px 15px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(42px, 6vw, 72px);
            line-height: 1.05;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: var(--blue);
        }

        .university {
            color: #334155;
            font-weight: 800;
            font-size: clamp(20px, 3vw, 29px);
            margin-bottom: 14px;
        }

        .typing-text {
            min-height: 52px;
            color: var(--blue);
            font-size: clamp(22px, 3vw, 32px);
            font-weight: 800;
            margin-bottom: 18px;
        }

        .hero-description {
            max-width: 700px;
            color: var(--muted);
            font-size: 17px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            transition: 0.25s ease;
        }

        .button-primary {
            background: var(--blue);
            color: white;
        }

        .button-primary:hover {
            background: var(--blue-dark);
            transform: translateY(-2px);
        }

        .button-outline {
            background: white;
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .button-outline:hover {
            color: var(--blue);
            border-color: #93c5fd;
            transform: translateY(-2px);
        }

        .profile-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 34px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .profile-circle {
            width: 185px;
            height: 185px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            border: 5px solid white;
            box-shadow: 0 18px 40px rgba(37, 99, 235, 0.14);
            font-size: 72px;
        }

        .profile-card h3 {
            color: var(--dark);
            margin-top: 18px;
            font-size: 24px;
        }

        .profile-card p {
            color: var(--muted);
            margin-top: 8px;
        }

        /* =========================
           GENERAL SECTION
        ========================= */

        section {
            padding: 88px 0;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-icon {
            display: block;
            font-size: 31px;
            margin-bottom: 8px;
        }

        .section-heading h2 {
            display: inline-block;
            color: var(--blue);
            font-size: 35px;
        }

        .section-heading h2::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background: var(--blue);
            border-radius: 20px;
            margin: 9px auto 0;
        }

        .section-heading p {
            max-width: 730px;
            margin: 14px auto 0;
            color: var(--muted);
        }

        /* =========================
           ABOUT
        ========================= */

        .about-box {
            max-width: 900px;
            margin: auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 34px;
            box-shadow: var(--shadow);
        }

        .about-box p {
            margin-bottom: 15px;
        }

        .about-box p:last-child {
            margin-bottom: 0;
        }

        /* =========================
           EDUCATION TIMELINE
        ========================= */

        .timeline {
            max-width: 900px;
            margin: auto;
            position: relative;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 23px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #bfdbfe;
        }

        .timeline-item {
            position: relative;
            padding-left: 70px;
            margin-bottom: 30px;
        }

        .timeline-dot {
            position: absolute;
            left: 8px;
            top: 7px;
            width: 31px;
            height: 31px;
            border-radius: 50%;
            background: var(--blue);
            border: 5px solid white;
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        .timeline-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 26px;
            box-shadow: var(--shadow);
        }

        .timeline-card h3 {
            color: var(--dark);
            margin-bottom: 7px;
        }

        .timeline-date {
            color: var(--blue-dark);
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        /* =========================
           HOBBIES
        ========================= */

        .hobby-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 900px;
            margin: auto;
        }

        .hobby-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .hobby-card:hover {
            transform: translateY(-5px);
        }

        .hobby-icon {
            font-size: 37px;
            margin-bottom: 10px;
        }

        .hobby-card h3 {
            color: var(--dark);
            font-size: 17px;
        }

        /* =========================
           3D SKILL CUBE
        ========================= */

        .cube-section {
            background: var(--light);
        }

        .cube-stage {
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            overflow: visible;
        }

        .skill-cube {
            position: relative;
            width: 270px;
            height: 270px;
            transform-style: preserve-3d;
            animation: rotateSkillCube 12s linear infinite;
        }

        .skill-face {
            position: absolute;
            width: 270px;
            height: 270px;
            border: 2px solid #cbd5e1;
            background: linear-gradient(145deg, #ffffff, #eef5ff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            box-shadow: inset 0 0 30px rgba(37, 99, 235, 0.06);
        }

        .skill-face .cube-emoji {
            font-size: 60px;
            margin-bottom: 14px;
        }

        .skill-face h3 {
            color: var(--dark);
            margin-bottom: 8px;
        }

        .skill-face p {
            color: var(--muted);
            font-size: 13px;
        }

        .skill-front {
            transform: translateZ(135px);
        }

        .skill-back {
            transform: rotateY(180deg) translateZ(135px);
        }

        .skill-right {
            transform: rotateY(90deg) translateZ(135px);
        }

        .skill-left {
            transform: rotateY(-90deg) translateZ(135px);
        }

        .skill-top {
            transform: rotateX(90deg) translateZ(135px);
        }

        .skill-bottom {
            transform: rotateX(-90deg) translateZ(135px);
        }

        @keyframes rotateSkillCube {
            0% {
                transform: rotateX(-12deg) rotateY(0deg);
            }

            25% {
                transform: rotateX(15deg) rotateY(90deg);
            }

            50% {
                transform: rotateX(-15deg) rotateY(180deg);
            }

            75% {
                transform: rotateX(12deg) rotateY(270deg);
            }

            100% {
                transform: rotateX(-12deg) rotateY(360deg);
            }
        }

        /* =========================
           SKILL BARS
        ========================= */

        .skill-note {
            text-align: center;
            max-width: 720px;
            margin: -20px auto 38px;
            color: var(--muted);
        }

        .skill-bars {
            max-width: 920px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .skill-bar-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: var(--shadow);
        }

        .skill-bar-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .skill-bar-name {
            color: var(--dark);
            font-weight: 800;
        }

        .skill-bar-percent {
            color: var(--blue);
            font-weight: 800;
        }

        .track {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                #2563eb,
                #60a5fa
            );
            transition: width 1.7s cubic-bezier(.16,1,.3,1);
        }

        /* =========================
           PROJECTS
        ========================= */

        .projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .project-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: transform .3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-icon {
            font-size: 46px;
            margin-bottom: 12px;
        }

        .project-card h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .project-card p {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background: #eef2ff;
            color: #475569;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .project-link {
            color: var(--blue-dark);
            font-weight: 800;
            font-size: 14px;
        }

        /* =========================
           LEARNING CUBE
        ========================= */

        .learning-section {
            background: var(--light);
        }

        .learning-note {
            max-width: 760px;
            margin: -15px auto 35px;
            text-align: center;
            color: var(--muted);
        }

        .learning-stage {
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: visible;
        }

        .learning-cube {
            position: relative;
            width: 250px;
            height: 250px;
            transform-style: preserve-3d;
            animation: rotateLearningCube 15s linear infinite;
        }

        .learning-face {
            position: absolute;
            width: 250px;
            height: 250px;
            background: white;
            border: 2px solid #cbd5e1;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 22px;
        }

        .learning-face .big {
            font-size: 54px;
            margin-bottom: 14px;
        }

        .learning-face h3 {
            color: var(--dark);
            margin-bottom: 7px;
        }

        .learning-face p {
            color: var(--muted);
            font-size: 13px;
        }

        .learning-front {
            transform: translateZ(125px);
        }

        .learning-back {
            transform: rotateY(180deg) translateZ(125px);
        }

        .learning-right {
            transform: rotateY(90deg) translateZ(125px);
        }

        .learning-left {
            transform: rotateY(-90deg) translateZ(125px);
        }

        .learning-top {
            transform: rotateX(90deg) translateZ(125px);
        }

        .learning-bottom {
            transform: rotateX(-90deg) translateZ(125px);
        }

        @keyframes rotateLearningCube {
            0% {
                transform: rotateX(0deg) rotateY(0deg);
            }

            25% {
                transform: rotateX(90deg) rotateY(90deg);
            }

            50% {
                transform: rotateX(180deg) rotateY(180deg);
            }

            75% {
                transform: rotateX(270deg) rotateY(270deg);
            }

            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        /* =========================
           VERIFY
        ========================= */

        .verify {
            max-width: 850px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .verify-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .verify-card h3 {
            color: var(--dark);
            margin-bottom: 6px;
        }

        .verify-card p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           ACHIEVEMENTS
        ========================= */

        .achievement-grid {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .achievement-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .achievement-card h3 {
            color: var(--dark);
            margin-bottom: 8px;
        }

        .achievement-card p {
            color: var(--muted);
        }

        /* =========================
           LINKS
        ========================= */

        .links {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: .25s ease;
        }

        .link-card:hover {
            transform: translateY(-4px);
            border-color: #93c5fd;
        }

        .link-icon {
            font-size: 29px;
        }

        .link-card h3 {
            color: var(--dark);
            font-size: 16px;
        }

        .link-card p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact-box {
            max-width: 900px;
            margin: auto;
            background: var(--dark);
            color: white;
            border-radius: 24px;
            padding: 45px;
            text-align: center;
        }

        .contact-box .section-heading {
            margin-bottom: 20px;
        }

        .contact-box .section-heading h2 {
            color: white;
        }

        .contact-box .section-heading h2::after {
            background: white;
        }

        .contact-intro {
            max-width: 650px;
            margin: auto;
            color: #cbd5e
