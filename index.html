<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mustafa Ahmed | IT Support Portfolio</title>

    <meta
        name="description"
        content="Mustafa Ahmed - BCA Graduate | IT Support | Technical Support | IT Operations"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #334155;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        /* NAVIGATION */

        nav {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0f172a;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            list-style: none;
        }

        .nav-links a {
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #2563eb;
        }


        /* HERO */

        .hero {
            padding: 100px 0;
            background: #f8fafc;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: center;
        }

        .hero-label {
            display: inline-block;
            padding: 7px 14px;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .hero h1 {
            color: #0f172a;
            font-size: 58px;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero-subtitle {
            font-size: 24px;
            color: #334155;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .hero-text {
            color: #64748b;
            font-size: 17px;
            max-width: 700px;
        }

        .hero-buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .button-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .button-primary:hover {
            background: #1d4ed8;
        }

        .button-secondary {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }

        .button-secondary:hover {
            color: #2563eb;
        }

        .profile-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
        }

        .profile-icon {
            width: 160px;
            height: 160px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 70px;
        }

        .profile-card h2 {
            color: #0f172a;
            margin-top: 18px;
        }

        .profile-card p {
            color: #64748b;
        }


        /* SECTIONS */

        section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title .icon {
            display: block;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .section-title h2 {
            display: inline-block;
            color: #2563eb;
            font-size: 34px;
        }

        .section-title h2::after {
            content: "";
            display: block;
            width: 55px;
            height: 3px;
            background: #2563eb;
            margin: 8px auto 0;
        }

        .section-title p {
            color: #64748b;
            margin-top: 10px;
        }


        /* ABOUT */

        .about-box {
            max-width: 900px;
            margin: auto;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 32px;
        }

        .about-box p {
            margin-bottom: 15px;
        }

        .about-box p:last-child {
            margin-bottom: 0;
        }


        /* EDUCATION */

        .education-card {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 30px;
        }

        .education-year {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .education-card h3 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .education-card p {
            color: #64748b;
            margin-bottom: 4px;
        }


        /* HOBBIES */

        .hobbies-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .hobby-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px 12px;
            text-align: center;
            background: #ffffff;
        }

        .hobby-card .emoji {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .hobby-card h3 {
            color: #0f172a;
            font-size: 15px;
        }


        /* SKILLS */

        .skills-section {
            background: #f8fafc;
        }

        .skills-grid {
            max-width: 950px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .skill-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px;
        }

        .skill-card h3 {
            color: #0f172a;
            margin-bottom: 7px;
        }

        .skill-card p {
            color: #64748b;
            font-size: 14px;
        }

        .skill-levels {
            max-width: 950px;
            margin: 35px auto 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .skill-level {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
        }

        .skill-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .skill-name {
            font-weight: bold;
            color: #0f172a;
        }

        .skill-percent {
            font-weight: bold;
            color: #2563eb;
        }

        .skill-bar {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 20px;
        }

        .skill-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 20px;
        }


        /* PROJECTS */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .project-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 30px;
        }

        .project-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .project-card h3 {
            color: #0f172a;
            font-size: 21px;
            margin-bottom: 10px;
        }

        .project-card p {
            color: #64748b;
            margin-bottom: 17px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 18px;
        }

        .tag {
            background: #eff6ff;
            color: #475569;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .project-link {
            color: #1d4ed8;
            font-weight: bold;
        }


        /* LEARNING */

        .learning-section {
            background: #f8fafc;
        }

        .learning-grid {
            max-width: 950px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .learning-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .learning-card .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .learning-card h3 {
            color: #0f172a;
            margin-bottom: 6px;
        }

        .learning-card p {
            color: #64748b;
            font-size: 14px;
        }


        /* VERIFY */

        .verify-grid {
            max-width: 850px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .verify-card {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .verify-card .icon {
            font-size: 38px;
        }

        .verify-card h3 {
            color: #0f172a;
            margin: 8px 0;
        }

        .verify-card p {
            color: #64748b;
            font-size: 14px;
        }


        /* ACHIEVEMENTS */

        .achievements-grid {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .achievement-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            background: #ffffff;
        }

        .achievement-card h3 {
            color: #0f172a;
            margin-bottom: 7px;
        }

        .achievement-card p {
            color: #64748b;
        }


        /* LANGUAGES */

        .languages-grid {
            max-width: 800px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .language-card {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .language-card .icon {
            font-size: 35px;
        }

        .language-card h3 {
            color: #0f172a;
            margin-top: 7px;
        }


        /* PROFESSIONAL LINKS */

        .professional-links {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .professional-link {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 21px;
        }

        .professional-link .icon {
            font-size: 30px;
        }

        .professional-link h3 {
            color: #0f172a;
            font-size: 17px;
        }

        .professional-link p {
            color: #64748b;
            font-size: 13px;
        }


        /* CONTACT */

        .contact-section {
            background: #f8fafc;
        }

        .contact-box {
            max-width: 900px;
            margin: auto;
            background: #0f172a;
            color: white;
            border-radius: 22px;
            padding: 40px;
        }

        .contact-box .section-title h2 {
            color: white;
        }

        .contact-box .section-title h2::after {
            background: white;
        }

        .contact-box .section-title p {
            color: #94a3b8;
        }

        .email {
            display: block;
            text-align: center;
            color: #93c5fd;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .contact-form {
            max-width: 700px;
            margin: auto;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .contact-form textarea {
            min-height: 140px;
            resize: vertical;
        }

        .submit-button {
            display: block;
            margin: auto;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .contact-note {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 10px;
        }


        /* FOOTER */

        footer {
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            text-align: center;
            padding: 28px;
            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 900px) {

            .hero-grid {
                grid-template-columns: 1fr;
            }

            .profile-card {
                max-width: 500px;
                margin: auto;
            }

            .hobbies-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        @media (max-width: 700px) {

            .nav-container {
                flex-direction: column;
                padding: 12px 0;
            }

            .nav-links {
                justify-content: center;
                gap: 12px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .hero {
                padding: 70px 0;
            }

            .hero h1 {
                font-size: 42px;
            }

            .skills-grid,
            .skill-levels,
            .projects-grid,
            .learning-grid,
            .verify-grid,
            .achievements-grid,
            .professional-links {
                grid-template-columns: 1fr;
            }

            .languages-grid {
                grid-template-columns: 1fr;
            }

            .hobbies-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .contact-box {
                padding: 30px 18px;
            }

        }


        @media (max-width: 450px) {

            .hobbies-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 36px;
            }

        }

    </style>

</head>
